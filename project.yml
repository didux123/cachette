name: Cachette
options:
  bundleIdPrefix: com.didux
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Cachette:
    type: application
    platform: iOS
    sources:
      - Cachette
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Cachette/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cachette
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Cachette utilise la caméra pour scanner les codes des boîtes de médicaments, lire les dates de péremption et photographier vos documents. Tout reste sur votre téléphone."
        NSFaceIDUsageDescription: "Face ID protège l'accès à votre coffre à documents."
        NSMicrophoneUsageDescription: "Le micro permet de dicter tes mouvements de stock à l'assistant (« j'ai utilisé 2 bandelettes »). La voix est traitée localement."
        NSSpeechRecognitionUsageDescription: "La reconnaissance vocale transforme ta dictée en texte pour l'assistant. Tout reste sur ton téléphone."
        BGTaskSchedulerPermittedTaskIdentifiers:
          - com.didux.cachette.bdpmRefresh
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didux.cachette
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  CachetteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CachetteTests
    dependencies:
      - target: Cachette
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  CachetteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/CachetteUITests
    dependencies:
      - target: Cachette
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase (Objective-C) est incompatible avec l'isolation
        # MainActor par défaut : on garde l'isolation classique ici.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Cachette:
    build:
      targets:
        Cachette: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CachetteTests
        - CachetteUITests
